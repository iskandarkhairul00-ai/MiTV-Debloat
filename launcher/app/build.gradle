plugins {
    id 'com.android.application'
}

android {
    namespace 'my.rafhan.app.tvhome'
    compileSdk 36

    defaultConfig {
        applicationId 'my.rafhan.app.tvhome'
        minSdk 29          // the Mi TV runs Android 10
        targetSdk 36       // some Google TV 14 sets refuse old targets at install
        versionCode 5
        versionName '1.7'
    }

    buildTypes {
        // What build-and-install.sh installs: R8-shrunk code and resources. Signed with the debug
        // key so it upgrades the existing install in place (same signature, data kept).
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // Unit tests read a stubbed android.jar; the pure classes they exercise never call into it.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    // Loopback ADB client for the phone remote (D-pad and typing in any app while USB debugging is on).
    implementation 'dev.mobile:dadb:1.2.10'

    testImplementation 'junit:junit:4.13.2'
}
